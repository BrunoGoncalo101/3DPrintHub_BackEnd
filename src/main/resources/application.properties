spring.application.name=printhub

# Ligação ao MySQL Azure (DB_NAME por defeito: loja_dev)
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:loja_dev}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
# Upload de ficheiros 3D
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.uploads.dir=uploads

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# CORS: endereços do front-end autorizados, separados por vírgulas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Endereço do front-end, usado nos links enviados por email
app.frontend.url=${FRONTEND_URL:http://localhost:5173}